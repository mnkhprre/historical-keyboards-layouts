name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate layouts
        run: python3 scripts/validate.py

      - name: Build bundle
        run: |
          python3 scripts/build_bundle.py
          plutil -lint dist/HistoricalKeyboards.bundle/Contents/Info.plist
          cd dist && ditto -c -k --keepParent HistoricalKeyboards.bundle HistoricalKeyboards.bundle.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HistoricalKeyboards.bundle
          path: dist/HistoricalKeyboards.bundle.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/HistoricalKeyboards.bundle.zip --generate-notes
